stages:
  - build
  - create-zip
  - deploy

variables:
  NODE_ENV: production

# ✅ Etapa de compilación
build-app:
  stage: build
  image: node:lts
  before_script:
    - rm -rf package-lock.json
    - npm install
  script:
    - npm ci
    - npm run build
    - cp server.js dist/server.js  # Asegura que el server.js esté incluido
  artifacts:
    paths:
      - dist/
      - node_modules
    expire_in: 1 hour
  only:
    - develop

create-zip:
  stage: create-zip
  image: alpine
  before_script:
    - apk add --update zip
  script:
    - zip -r app.zip dist node_modules package.json package-lock.json
  artifacts:
    paths:
      - app.zip

# ✅ Etapa de despliegue a Azure App Service usando ZIP deploy
deploy-app-dev:
  stage: deploy
  image: mcr.microsoft.com/azure-cli
  script:
    - az login --service-principal -u "$AZ_APP_ID_TEST" -p "$AZ_APP_PWD_TEST" --tenant "$AZ_TENANT_ID_TEST" --output none
    - az webapp deploy --resource-group $DEV_RESOURCE_GROUP --name $DEV_APP_NAME --src-path app.zip --type zip
  only:
    - develop
